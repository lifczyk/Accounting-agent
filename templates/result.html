<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Результат анализа | IDP Агент</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans p-6">
    <div class="max-w-4xl mx-auto bg-white rounded-lg shadow p-6">
        <div class="flex justify-between items-center mb-6 border-b pb-4">
            <h1 class="text-xl font-bold text-slate-800">Результат анализа документов (Gemini Flash)</h1>
            <a href="/" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded text-sm">← Назад к загрузке</a>
        </div>

        <div class="mb-4">
            <h3 class="text-sm font-semibold text-gray-500 uppercase mb-2">Переданные источники:</h3>
            <pre class="bg-gray-50 p-3 rounded text-xs text-gray-700 border whitespace-pre-wrap">{{ source_info }}</pre>
        </div>

        <div>
            <h3 class="text-sm font-semibold text-gray-500 uppercase mb-2">Ответ ИИ / Извлеченные данные:</h3>
            <div class="bg-slate-900 text-emerald-400 p-4 rounded text-sm font-mono whitespace-pre-wrap">{{ result }}</div>
        </div>
    </div>
</body>
</html>
